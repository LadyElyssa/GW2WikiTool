<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GW2 Coordinate Converter</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:40px auto;padding:0 20px;color:#222}
h1{font-size:1.4em}.row{display:flex;gap:12px}.row>div{flex:1}
fieldset{border:1px solid #ccc;border-radius:8px;padding:14px 18px;margin:14px 0}
legend{font-weight:600}label{display:block;font-size:.85em;color:#555;margin-top:6px}
input{width:100%;padding:7px;box-sizing:border-box}
button{margin-top:12px;padding:9px 16px;border:0;border-radius:6px;background:#444;color:#fff;cursor:pointer}
.result{margin-top:14px;padding:12px;background:#f4f4f4;border-radius:8px;font-family:monospace;white-space:pre-wrap}
.hint{font-size:.82em;color:#777}#status{margin-top:10px;font-size:.85em}
</style>
</head>
<body>
<h1>GW2 Coordinate Converter</h1>
<p class="hint">Enter a GW2 Map ID and then the Wiki Coords to convert from Wiki coordinates (inches) to GW2/Mumble coordinates (metres).</p>
<fieldset>
<legend>Wiki → GW2</legend>
<div class="row">
<div><label>Map ID - Best used with the BlishHUD addon - Marker Pack Assistant.</label>
<input id="mapId" type="number" min="1" step="1" value=""><button onclick="loadMap()">Load map</button></div>
</div>
<div id="status">Loading map…</div>
<br>
<div class="row">
<div><label>Wiki X</label><input id="wx" type="number" step="any" value=""></div>
<div><label>Wiki Y</label><input id="wy" type="number" step="any" value=""></div>
</div>
<button onclick="wikiToGw2()">Convert</button>
<div class="result" id="wout"></div>
</fieldset>

<fieldset>
<legend>GW2 → Wiki</legend>
<div class="row">
<div><label>GW2 X (m)</label><input id="gx" type="number" step="any" value=""></div>
<div><label>GW2 Y (m)</label><input id="gy" type="number" step="any" value=""></div>
</div>
<button onclick="gw2ToWiki()">Convert</button>
<div class="result" id="gout"></div>
</fieldset>

<script>
const M_TO_IN = 5000 / 127;
let map = null;

async function loadMap() {
  const id = Number(document.getElementById('mapId').value);
  const status = document.getElementById('status');
  if (!Number.isInteger(id) || id < 1) {
    status.textContent = 'Enter a valid Map ID.';
    return;
  }

  status.textContent = 'Loading…';
  map = null;

  try {
    const r = await fetch(`https://api.guildwars2.com/v2/maps/${id}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();

    if (!data.map_rect || !data.continent_rect) {
      throw new Error('This map has no usable map_rect/continent_rect data.');
    }

    map = {
      mapX0: data.map_rect[0][0],
      mapY0: data.map_rect[0][1],
      mapX1: data.map_rect[1][0],
      mapY1: data.map_rect[1][1],
      contX0: data.continent_rect[0][0],
      contY0: data.continent_rect[0][1],
      contX1: data.continent_rect[1][0],
      contY1: data.continent_rect[1][1]
    };

    status.textContent = `${data.name} (Map ID ${id}) loaded.`;
  } catch (e) {
    status.textContent = `Unable to load map: ${e.message}`;
  }
}

function wikiToGw2() {
  if (!map) return setOutput('wout', 'Load a map first.');

  const x = Number(wx.value), y = Number(wy.value);
  const ix = map.mapX0 +
    (x - map.contX0) / (map.contX1 - map.contX0) *
    (map.mapX1 - map.mapX0);

  const iy = map.mapY1 -
    (y - map.contY0) / (map.contY1 - map.contY0) *
    (map.mapY1 - map.mapY0);

  setOutput('wout', `[ ${ (ix / M_TO_IN).toFixed(2) }, ${ (iy / M_TO_IN).toFixed(2) } ]`);
}

function gw2ToWiki() {
  if (!map) return setOutput('gout', 'Load a map first.');

  const x = Number(gx.value) * M_TO_IN;
  const y = Number(gy.value) * M_TO_IN;

  const wx = map.contX0 +
    (x - map.mapX0) / (map.mapX1 - map.mapX0) *
    (map.contX1 - map.contX0);

  const wy = map.contY0 +
    (map.mapY1 - y) / (map.mapY1 - map.mapY0) *
    (map.contY1 - map.contY0);

  setOutput('gout', `[ ${wx.toFixed(2)}, ${wy.toFixed(2)} ]`);
}

function setOutput(id, text) {
  document.getElementById(id).textContent = text;
}

loadMap();
</script>
</body>
</html>
